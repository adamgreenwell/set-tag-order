name: Run Tests

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WP_TESTS_DIR: /tmp/wordpress-tests-lib
  WP_CORE_DIR: /tmp/wordpress

jobs:
  integration:
    name: PHP ${{ matrix.php }} / WordPress ${{ matrix.wordpress }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.4'
            wordpress: '7.0'
          - php: '8.3'
            wordpress: '7.0'
          - php: '8.3'
            wordpress: '7.1'
          - php: '8.4'
            wordpress: '7.1'
          - php: '8.3'
            wordpress: 'latest'
            coverage: 'xdebug'

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
          MYSQL_USER: settagorder
          MYSQL_PASSWORD: settagorder
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, mysqli
          coverage: ${{ matrix.coverage || 'none' }}
          tools: composer:v2

      - name: Install test suite prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      # The WordPress test suite is installed inline so that a clean checkout of
      # this repository can run the full suite. Release and local-development
      # tooling is intentionally not published, so this workflow must not depend
      # on it. The database itself is created by the mysql service container.
      - name: Install WordPress test suite
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          set -euo pipefail

          if [[ "${WP_VERSION}" == "latest" ]]; then
            curl -fLsS https://api.wordpress.org/core/version-check/1.7/ -o /tmp/wp-version.json
            RESOLVED="$(grep -o '"version":"[^"]*' /tmp/wp-version.json | sed 's/"version":"//' | head -1)"
            ARCHIVE="latest"
          else
            curl -fLsS "https://api.wordpress.org/core/version-check/1.7/?version=${WP_VERSION}" -o /tmp/wp-version.json
            RESOLVED="$(grep -o '"version":"[^"]*' /tmp/wp-version.json | sed 's/"version":"//' \
              | grep -E "^${WP_VERSION}(\.|$)" | head -1)"
            ARCHIVE="wordpress-${RESOLVED:-$WP_VERSION}"
          fi

          if [[ -z "${RESOLVED}" ]]; then
            echo "Could not resolve a WordPress version for '${WP_VERSION}'." >&2
            exit 1
          fi

          # A trailing .0 is dropped from WordPress SVN tags (7.1.0 is tagged 7.1).
          TESTS_TAG="tags/${RESOLVED%.0}"
          echo "WordPress ${RESOLVED} (test suite: ${TESTS_TAG})"

          mkdir -p "${WP_CORE_DIR}"
          curl -fLsS "https://wordpress.org/${ARCHIVE}.tar.gz" -o /tmp/wordpress.tar.gz
          tar --strip-components=1 -zxmf /tmp/wordpress.tar.gz -C "${WP_CORE_DIR}"

          mkdir -p "${WP_TESTS_DIR}"
          svn export --quiet --ignore-externals \
            "https://develop.svn.wordpress.org/${TESTS_TAG}/tests/phpunit/includes/" "${WP_TESTS_DIR}/includes"
          svn export --quiet --ignore-externals \
            "https://develop.svn.wordpress.org/${TESTS_TAG}/tests/phpunit/data/" "${WP_TESTS_DIR}/data"

          curl -fLsS "https://develop.svn.wordpress.org/${TESTS_TAG}/wp-tests-config-sample.php" \
            -o "${WP_TESTS_DIR}/wp-tests-config.php"

          sed -i "s:dirname( __FILE__ ) . '/src/':'${WP_CORE_DIR}/':" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s:__DIR__ . '/src/':'${WP_CORE_DIR}/':" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/youremptytestdbnamehere/wordpress_test/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/yourusernamehere/settagorder/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/yourpasswordhere/settagorder/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s|localhost|127.0.0.1:3306|" "${WP_TESTS_DIR}/wp-tests-config.php"

      - name: Run integration tests
        run: composer test

      # Coverage runs on a single matrix entry: Xdebug roughly doubles the
      # runtime, and the number is the same on every PHP version.
      - name: Report code coverage
        if: matrix.coverage == 'xdebug'
        run: composer test:coverage
